<!doctype html>
<html lang="en-UG">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#002177" />
    <meta name="description" content="SAZO Garage: record jobs, photos and mileage for SAZO vehicle histories." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>SAZO Garage</title>
    <script>
      // Pick light or dark before the first paint (no white flash at night). Same rule as src/lib/theme.ts.
      try { var t = localStorage.getItem('sazo_theme'); document.documentElement.dataset.theme = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>SAZO Garage needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
