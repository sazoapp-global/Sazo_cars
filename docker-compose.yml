# Local development services. Start with: npm run dev:services
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sazo
      POSTGRES_PASSWORD: sazo
      POSTGRES_DB: sazo
    ports:
      # On this computer: SAZO_DB_PORT from .env (default 5433). 5433 avoids a PostgreSQL installed on Windows; if
      # Windows has reserved it too ("ports are not available"), choose another in .env. The API reads the same line.
      - "${SAZO_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sazo"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  pgdata:
