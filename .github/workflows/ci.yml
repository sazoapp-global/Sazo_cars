name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sazo
          POSTGRES_PASSWORD: sazo
          POSTGRES_DB: sazo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sazo"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sazo:sazo@localhost:5432/sazo
      TEST_DATABASE_URL: postgres://sazo:sazo@localhost:5432/sazo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint (code style + module boundaries)
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build && npm run build -w @sazo/api
      - name: Database migrations + schema tests
        run: npm run db:test
      - name: Unit, scenario and end-to-end tests
        run: npm test

  web:
    # The consumer web app in a real browser, against the real API on a freshly seeded database.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sazo
          POSTGRES_PASSWORD: sazo
          POSTGRES_DB: sazo_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sazo"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sazo:sazo@localhost:5432/sazo_e2e
      E2E_DATABASE_URL: postgres://sazo:sazo@localhost:5432/sazo_e2e
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build shared packages
        run: npm run build
      - name: Migrate and load the scenario vehicles
        run: npm run db:migrate && npm run seed -w @sazo/api
      - name: Build the web app (includes its type-check)
        run: npm run build -w @sazo/web
      - name: Install the browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Browser tests (journeys + accessibility)
        run: npx playwright test
        working-directory: apps/web
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
